services:
  db:
    image: postgres:16-alpine
    container_name: mithoworld_db_v2
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mitho_pg_data:/var/lib/postgresql/data
    networks:
      - mitho_net

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mithoworld_web_v2
    restart: unless-stopped
    command: >
      sh -c "uv run python manage.py migrate &&
             uv run python manage.py collectstatic --noinput &&
             uv run gunicorn backend.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
    volumes:
      - mitho_media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mitho_net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: mithoworld_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web
    networks:
      - mitho_net

volumes:
  mitho_pg_data:
    name: mitho_pg_data_v2
  mitho_media_data:
    name: mitho_media_data_v2

networks:
  mitho_net:
    driver: bridge