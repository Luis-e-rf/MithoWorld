services:
  db:
    image: postgres:16-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    container_name: mithoworld_db_v2
    restart: unless-stopped
    environment:
      # ⚠️ Solo aplica en la PRIMERA inicialización del volumen. Si cambiás
      # DB_PASSWORD después, hay que `docker volume rm mitho_pg_data_v2`
      # (destruye los datos) o hacer ALTER ROLE manualmente.
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - mitho_pg_data:/var/lib/postgresql/data

volumes:
  mitho_pg_data:
    name: mitho_pg_data_v2